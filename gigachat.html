<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Python Course</title>
    <style>
        :root { --primary: #3776ab; --bg: #f4f4f9; --card: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 15px; }
        
        /* Sidebar - Navigation */
        .sidebar { float: left; width: 250px; background: var(--card); padding: 15px; border-radius: 8px; height: calc(100vh - 60px); overflow-y: auto; position: sticky; top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .module-title { color: var(--primary); margin-top: 20px; font-size: 14px; text-transform: uppercase; }
        .lesson-link { display: block; padding: 8px 12px; text-decoration: none; color: #555; border-radius: 4px; margin-bottom: 4px; }
        .lesson-link:hover, .lesson-link.active { background: var(--primary); color: white; }

        /* Main Content */
        .main-content { margin-left: 280px; background: var(--card); padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); min-height: 600px; }
        h2 { color: var(--primary); }
        p, li { line-height: 1.6; }
        code { background: #eee; padding: 2px 6px; border-radius: 3px; color: #d63384; font-family: monospace; }
        pre { background: #2d2d2d; color: #f8f8f2; padding: 15px; border-radius: 5px; overflow-x: auto; }
        
        /* Editor & Task */
        .task-box { background: #fff; border: 1px solid #ddd; padding: 15px; margin-top: 20px; border-left: 5px solid var(--primary); }
        textarea#code-editor { width: 100%; height: 200px; font-family: monospace; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #1e1e1e; color: #00ff00; }
        button#run-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        button#run-btn:hover { background: #2b5e8b; }
        #output { margin-top: 15px; padding: 10px; border: 1px dashed #ccc; background: #fafafa; min-height: 40px; white-space: pre-wrap; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }

        /* Progress */
        .progress-container { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
        .progress-bar { width: 100%; background: #ddd; height: 20px; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Python Academy Lite</h1>
        <p>Мини-курс в одном файле: теория + практика</p>
    </header>

    <div class="sidebar">
        <h3>Программа курса</h3>
        <a href="#" class="lesson-link active" onclick="loadLesson('intro')">1. Введение и синтаксис</a>
        <span class="module-title">Основы</span>
        <a href="#" class="lesson-link" onclick="loadLesson('variables')">2. Переменные и типы данных</a>
        <a href="#" class="lesson-link" onclick="loadLesson('conditions')">3. Условия и циклы</a>
        
        <span class="module-title">Структуры данных</span>
        <a href="#" class="lesson-link" onclick="loadLesson('lists')">4. Списки и словари</a>
        <a href="#" class="lesson-link" onclick="loadLesson('functions')">5. Функции и модули</a>

        <span class="module-title">Практика</span>
        <a href="#" class="lesson-link" onclick="loadLesson('final')">6. Итоговый проект</a>
    </div>

    <div class="main-content">
        <div id="content-area">
            <!-- Content will be injected here -->
        </div>

        <div class="progress-container">
            <h3>Ваш прогресс</h3>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <p id="progress-text">0% завершено</p>
        </div>
    </div>
</div>

<script>
    // --- DATABASE OF LESSONS (Simulated) ---
    const lessons = {
        'intro': {
            title: '1. Введение и синтаксис',
            theory: '<h3>Основы Python</h3><p>Python — это интерпретируемый язык программирования общего назначения. Главная фишка — читаемость кода.</p><p>В Python отступы (пробелы) имеют значение. Они заменяют фигурные скобки <code>{}</code>.</p><pre>print("Hello, World!")</pre>',
            task: {
                prompt: 'Напишите код, который выводит фразу "Я изучаю Python" на экран.',
                validator: (output) => output.includes('Я изучаю Python')
            }
        },
        'variables': {
            title: '2. Переменные и типы данных',
            theory: '<h3>Переменные</h3><p>Переменная — это контейнер для хранения данных. В Python не нужно объявлять тип переменной заранее.</p><pre>age = 25\nname = "Alice"\nprice = 19.99\nis_ready = True</pre><p>Основные типы: <b>int</b> (число), <b>str</b> (строка), <b>float</b>, <b>bool</b>.</p>',
            task: {
                prompt: 'Создайте переменную <code>city</code> со значением "Москва" и выведите её.',
                validator: (output) => output.includes('Москва')
            }
        },
        'conditions': {
            title: '3. Условия и циклы',
            theory: '<h3>Логика в коде</h3><p>Используем <code>if</code>, <code>else</code> и <code>elif</code> для ветвления.</p><pre>x = 10\nif x > 5:\n    print("Больше пяти")\nelse:\n    print("Меньше или равно")</pre><p>Цикл <code>for</code> перебирает элементы:</p><pre>for i in range(3):\n    print(i)</pre>',
            task: {
                prompt: 'Проверьте, больше ли число 15, чем 10. Если да — выведите "Верно", иначе "Неверно".',
                validator: (output) => output.includes('Верно')
            }
        },
        'lists': {
            title: '4. Списки и словари',
            theory: '<h3>Коллекции данных</h3><p><b>Списки (Lists)</b> хранят упорядоченные данные: <code>[1, 2, 3]</code>. <b>Словари (Dictionaries)</b> хранят пары ключ-значение: <code>{\'name\': \'Bob\'}</code>.</p><pre>fruits = ["яблоко", "банан"]\nprint(fruits[0]) # яблоко\n\nuser = {"name": "Bob", "age": 30}\nprint(user["name"])</pre>',
            task: {
                prompt: 'Создайте список из 3-х любых фруктов и выведите второй элемент списка.',
                validator: (output) => output !== '' && output !== undefined
            }
        },
        'functions': {
            title: '5. Функции и модули',
            theory: '<h3>Функции</h3><p>Функция — это блок кода, который можно вызывать многократно.</p><pre>def greet(name):\n    return f"Привет, {name}!"\n\nprint(greet("Мир"))</pre>',
            task: {
                prompt: 'Напишите функцию <code>square(x)</code>, которая возвращает квадрат числа. Вызовите её с числом 5 и выведите результат.',
                validator: (output) => output.includes('25')
            }
        },
        'final': {
            title: '6. Итоговый проект',
            theory: '<h3>Калькулятор площади</h3><p>Объединим все знания: создайте программу, которая запрашивает у пользователя длину и ширину прямоугольника и выводит его площадь. (Для упрощения в этом тренажере мы просто эмулируем ввод).',
            task: {
                prompt: 'Рассчитайте площадь прямоугольника со сторонами 10 и 20. Выведите только число.',
                validator: (output) => output.trim() === '200'
            }
        }
    };

    let currentLesson = 'intro';
    let completedLessons = new Set();

    function loadLesson(id) {
        currentLesson = id;
        const lesson = lessons[id];
        
        // Update UI Links
        document.querySelectorAll('.lesson-link').forEach(el => el.classList.remove('active'));
        event.target.classList.add('active');

        // Render Content
        document.getElementById('content-area').innerHTML = `
            <h2>${lesson.title}</h2>
            ${lesson.theory}
            
            <div class="task-box">
                <h4>🧠 Практическое задание:</h4>
                <p>${lesson.task.prompt}</p>
                <textarea id="code-editor" placeholder="Напишите код здесь...">
# Начните писать код
</textarea>
                <br>
                <button id="run-btn" onclick="runCode()">Запустить код</button>
                <div><strong>Результат:</strong></div>
                <div id="output"></div>
            </div>
        `;
    }

    function runCode() {
        const code = document.getElementById('code-editor').value;
        const outputDiv = document.getElementById('output');
        const currentLessonObj = lessons[currentLesson];
        
        outputDiv.className = '';
        outputDiv.textContent = 'Выполнение...';

        try {
            // Sandboxed execution using Function constructor (Simple eval for demo)
            // In a real app, this would be a secure worker or server-side check
            const logs = [];
            const originalLog = console.log;
            console.log = (msg) => logs.push(msg);

            eval(code); // ⚠️ WARNING: eval is dangerous in production. Used here for demo simplicity.

            console.log = originalLog;

            const output = logs.join('\n');
            outputDiv.textContent = output;

            if (currentLessonObj.task.validator(output)) {
                outputDiv.classList.add('success');
                outputDiv.textContent += '\n✅ Задание выполнено!';
                
                if (!completedLessons.has(currentLesson)) {
                    completedLessons.add(currentLesson);
                    updateProgress();
                }
            } else {
                outputDiv.classList.add('error');
                outputDiv.textContent += '\n❌ Проверьте логику. Попробуйте еще раз!';
            }

        } catch (e) {
            console.log(e);
            outputDiv.classList.add('error');
            outputDiv.textContent = `Ошибка: ${e.message}\nПроверьте синтаксис.`;
        }
    }

    function updateProgress() {
        const total = Object.keys(lessons).length;
        const completed = completedLessons.size;
        const percent = Math.round((completed / total) * 100);
        
        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('progress-text').textContent = `${percent}% завершено`;
    }

    // Initialize first lesson
    loadLesson('intro');
</script>

</body>
</html>
